[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-applier"
version = "0.1.0"
description = "Candidatura automatizada a vagas no LinkedIn."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright==1.64.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
job-applier = "job_applier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
