[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-applier"
version = "0.1.0"
description = "Candidatura automatizada a vagas no LinkedIn."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright==1.64.1",
    "pydantic==2.14.2",
    "jinja2==3.1.6",
    "weasyprint==70.0",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
job-applier = "job_applier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_applier = ["resume/templates/*.html", "resume/templates/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
