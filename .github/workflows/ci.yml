name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar bibliotecas do WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Instalar dependências
        run: pip install ".[dev]"

      - name: Instalar Firefox do Playwright
        run: playwright install --with-deps firefox

      - name: Rodar testes
        run: pytest

  docker:
    name: Testes no Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construir imagem
        run: docker compose build

      - name: Rodar testes no contêiner
        run: docker compose run --rm app pytest
